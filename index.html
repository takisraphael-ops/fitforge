<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d14" />
  <meta name="description" content="FitForge — an offline-first workout and nutrition tracker" />
  <title>FitForge — Offline Fitness Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <!-- Inter is self-hosted; the @font-face rules live at the top of styles.css. -->
  <link rel="stylesheet" href="./css/styles.css?v=278" />
</head>
<body>
  <!-- Launch splash — orbit mark, plays once per load then fades into the app -->
  <div id="splash" class="splash" role="presentation" aria-hidden="true">
    <div class="splash-mark">
      <span class="s-ring s-ring-1"></span>
      <span class="s-ring s-ring-2"></span>
      <span class="s-ring s-ring-3"></span>
      <span class="s-core"></span>
    </div>
    <div class="splash-word">FitForge</div>
    <div class="splash-tag">MOVE · FUEL · RECOVER</div>
    <div class="splash-load"><i></i></div>
  </div>
  <script>
    (function () {
      var s = document.getElementById("splash");
      if (!s) return;
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // Dismissed when the app says it's ready, not on a fixed clock. The
      // old 1400ms hold was disconnected from readiness in both directions:
      // a fast boot (~200ms) sat behind a finished animation, and a slow one
      // dropped the user onto a half-rendered page. A short floor keeps the
      // mark from strobing on fast boots; the 4s ceiling is a failsafe so a
      // crashed boot can't strand the splash forever.
      var minHold = reduce ? 250 : 700;
      var started = Date.now();
      var t;
      function done() {
        clearTimeout(t);
        s.classList.add("splash-done");
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
      }
      window.__ffSplashDone = function () {
        var wait = Math.max(0, minHold - (Date.now() - started));
        setTimeout(done, wait);
      };
      t = setTimeout(done, 4000);
      s.addEventListener("click", done);
    })();
  </script>

  <div class="app">
    <header id="header" class="header"></header>
    <main id="main"></main>
  </div>
  <!-- Cache-bust query so PWA clients cannot stick on old JS -->
  <script src="./data/exercises.js?v=278"></script>
  <script src="./data/meals.js?v=278"></script>
  <script src="./data/ingredients.js?v=278"></script>
  <script src="./data/sessions.js?v=278"></script>
  <script src="./data/learn.js?v=278"></script>
  <!-- After learn.js: the pattern guides are appended to LEARN_ARTICLES. -->
  <script src="./data/diet-plans.js?v=278"></script>
  <script src="./data/progressions.js?v=278"></script>
  <script src="./data/disciplines.js?v=278"></script>
  <script src="./js/meal-search.js?v=278"></script>
  <script src="./js/diet-plan.js?v=278"></script>
  <script src="./js/progression.js?v=278"></script>
  <script src="./js/exercise-links.js?v=278"></script>
  <script src="./js/utils.js?v=278"></script>
  <script src="./js/storage.js?v=278"></script>
  <script src="./js/body-map.js?v=278"></script>
  <script src="./js/interval-runner.js?v=278"></script>
  <script src="./js/app.js?v=278"></script>
</body>
</html>
