<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d14" />
  <meta name="description" content="FitForge — an offline-first workout and nutrition tracker" />
  <title>FitForge — Offline Fitness Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Loaded asynchronously — media="print" means it never blocks, and onload
    promotes it once it has arrived. It used to be an ordinary stylesheet, and
    a pending stylesheet blocks every script after it: the inline splash script
    below could not even start its own timer until Google answered. So an
    offline-first app spent every cold launch waiting on a third-party CDN
    before running a line of its own code, and offline it waited for the
    request to fail. Measured here at 12.7s to DOMContentLoaded against 122ms
    with the request blocked.

    Safe to defer because every --font-* var in styles.css already carries a
    full system stack: text renders in the system font and upgrades to Inter
    if and when it turns up.
  -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
  <link rel="stylesheet" href="./css/styles.css?v=228" />
</head>
<body>
  <!-- Launch splash — orbit mark, plays once per load then fades into the app -->
  <div id="splash" class="splash" role="presentation" aria-hidden="true">
    <div class="splash-mark">
      <span class="s-ring s-ring-1"></span>
      <span class="s-ring s-ring-2"></span>
      <span class="s-ring s-ring-3"></span>
      <span class="s-core"></span>
    </div>
    <div class="splash-word">FitForge</div>
    <div class="splash-tag">MOVE · FUEL · RECOVER</div>
    <div class="splash-load"><i></i></div>
  </div>
  <script>
    (function () {
      var s = document.getElementById("splash");
      if (!s) return;
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // The choreography in styles.css finishes at ~1.2s; this holds it just
      // long enough to land. It was 3500, which left 1.3s of a finished
      // animation sitting there before a 600ms fade — over four seconds
      // between tapping the icon and reaching the app, every single launch.
      var hold = reduce ? 300 : 1400;
      var t;
      function done() {
        clearTimeout(t);
        s.classList.add("splash-done");
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
      }
      t = setTimeout(done, hold);
      s.addEventListener("click", done);
    })();
  </script>

  <div class="app">
    <header id="header" class="header"></header>
    <main id="main"></main>
  </div>
  <!-- Cache-bust query so PWA clients cannot stick on old JS -->
  <script src="./data/exercises.js?v=228"></script>
  <script src="./data/meals.js?v=228"></script>
  <script src="./data/sessions.js?v=228"></script>
  <script src="./data/learn.js?v=228"></script>
  <!-- After learn.js: the pattern guides are appended to LEARN_ARTICLES. -->
  <script src="./data/diet-plans.js?v=228"></script>
  <script src="./js/meal-search.js?v=228"></script>
  <script src="./js/diet-plan.js?v=228"></script>
  <script src="./js/utils.js?v=228"></script>
  <script src="./js/storage.js?v=228"></script>
  <script src="./js/body-map.js?v=228"></script>
  <script src="./js/interval-runner.js?v=228"></script>
  <script src="./js/app.js?v=228"></script>
</body>
</html>
