<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d14" />
  <meta name="description" content="FitForge — an offline-first workout and nutrition tracker" />
  <title>FitForge — Offline Fitness Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
  <!-- Inter is self-hosted; the @font-face rules live at the top of styles.css. -->
  <link rel="stylesheet" href="./css/styles.css?v=263" />
</head>
<body>
  <!-- Launch splash — orbit mark, plays once per load then fades into the app -->
  <div id="splash" class="splash" role="presentation" aria-hidden="true">
    <div class="splash-mark">
      <span class="s-ring s-ring-1"></span>
      <span class="s-ring s-ring-2"></span>
      <span class="s-ring s-ring-3"></span>
      <span class="s-core"></span>
    </div>
    <div class="splash-word">FitForge</div>
    <div class="splash-tag">MOVE · FUEL · RECOVER</div>
    <div class="splash-load"><i></i></div>
  </div>
  <script>
    (function () {
      var s = document.getElementById("splash");
      if (!s) return;
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // The choreography in styles.css finishes at ~1.2s; this holds it just
      // long enough to land. It was 3500, which left 1.3s of a finished
      // animation sitting there before a 600ms fade — over four seconds
      // between tapping the icon and reaching the app, every single launch.
      var hold = reduce ? 300 : 1400;
      var t;
      function done() {
        clearTimeout(t);
        s.classList.add("splash-done");
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400);
      }
      t = setTimeout(done, hold);
      s.addEventListener("click", done);
    })();
  </script>

  <div class="app">
    <header id="header" class="header"></header>
    <main id="main"></main>
  </div>
  <!-- Cache-bust query so PWA clients cannot stick on old JS -->
  <script src="./data/exercises.js?v=263"></script>
  <script src="./data/meals.js?v=263"></script>
  <script src="./data/sessions.js?v=263"></script>
  <script src="./data/learn.js?v=263"></script>
  <!-- After learn.js: the pattern guides are appended to LEARN_ARTICLES. -->
  <script src="./data/diet-plans.js?v=263"></script>
  <script src="./data/progressions.js?v=263"></script>
  <script src="./data/disciplines.js?v=263"></script>
  <script src="./js/meal-search.js?v=263"></script>
  <script src="./js/diet-plan.js?v=263"></script>
  <script src="./js/progression.js?v=263"></script>
  <script src="./js/exercise-links.js?v=263"></script>
  <script src="./js/utils.js?v=263"></script>
  <script src="./js/storage.js?v=263"></script>
  <script src="./js/body-map.js?v=263"></script>
  <script src="./js/interval-runner.js?v=263"></script>
  <script src="./js/app.js?v=263"></script>
</body>
</html>
